<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="theme-color" content="#0d0d0d">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Gym Log</title>
<style>
:root{--bg:#0d0d0d;--bg2:#161616;--bg3:#1e1e1e;--border:#2a2a2a;--border2:#444;--text:#f0f0f0;--text2:#888;--text3:#555;--green:#4caf50;--red:#e05c45;--blue:#4a9eda;--gold:#c9a227;--radius:10px;--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overscroll-behavior:none}
#app{max-width:480px;margin:0 auto;padding-bottom:calc(70px + var(--safe-bottom))}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg2);border-top:1px solid var(--border);display:flex;padding-bottom:var(--safe-bottom);z-index:50}
.nbtn{flex:1;padding:10px 0 8px;background:none;border:none;color:var(--text3);font-size:9px;letter-spacing:.3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.nbtn.active{color:var(--text)}
.nbtn svg{width:20px;height:20px}
.timer-wrap{position:fixed;bottom:calc(62px + var(--safe-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;z-index:100;transition:opacity .25s,transform .25s}
.timer-wrap.hidden{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(10px)}
.timer-box{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 24px rgba(0,0,0,.6)}
.tcircle{width:48px;height:48px;border-radius:50%;border:2.5px solid var(--blue);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--blue);flex-shrink:0;transition:border-color .3s,color .3s}
.tcircle.urgent{border-color:var(--red);color:var(--red)}
.tcircle.done{border-color:var(--green);color:var(--green)}
.tprog-bg{flex:1}
.tprog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.tprog-label{font-size:11px;color:var(--text2)}
.tdurs{display:flex;gap:4px}
.tdur{background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text2);padding:3px 8px;font-size:11px;cursor:pointer;font-family:inherit}
.tdur.sel{border-color:var(--blue);color:var(--blue)}
.tbar-bg{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.tbar-fill{height:4px;border-radius:2px;background:var(--blue);transition:width .95s linear,background .3s}
.tskip{background:none;border:1px solid var(--border);border-radius:8px;color:var(--text2);padding:8px 12px;font-size:12px;cursor:pointer;font-family:inherit;flex-shrink:0}
.phead{padding:52px 16px 12px;border-bottom:1px solid var(--border)}
.phead h1{font-size:26px;font-weight:700;letter-spacing:-.5px}
.phead p{font-size:13px;color:var(--text2);margin-top:3px}
.pad{padding:14px 16px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.cardtap{cursor:pointer}
.cardtap:active{opacity:.8}
.divider{height:1px;background:var(--border);margin:12px 0}
.empty{text-align:center;padding:60px 20px;color:var(--text2);font-size:14px;line-height:1.6}
.slabel{font-size:11px;letter-spacing:1px;color:var(--text3);text-transform:uppercase;margin-bottom:8px}
.back-row{display:flex;align-items:center;gap:8px;padding:52px 16px 12px;border-bottom:1px solid var(--border);cursor:pointer}
.back-row h2{font-size:18px;font-weight:600}
.toast{position:fixed;bottom:calc(80px + var(--safe-bottom));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.badge{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;font-size:13px;font-weight:700;flex-shrink:0}
.bA,.bA2{background:#2a2000;color:var(--gold)}
.bB,.bB2{background:#001a2e;color:var(--blue)}
.bC,.bC2{background:#2a0a00;color:var(--red)}
.mtag{font-size:11px;padding:2px 8px;background:var(--bg3);border-radius:20px;color:var(--text2);display:inline-block;margin:2px 3px 0 0}
.ptag{font-size:11px;padding:2px 8px;border-radius:20px}
.ptA,.ptA2{background:#2a2000;color:var(--gold)}
.ptB,.ptB2{background:#001a2e;color:var(--blue)}
.ptC,.ptC2{background:#2a0a00;color:var(--red)}
.ex-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.ex-card.alldone{border-color:var(--green)}
.ex-card.swapped{border-color:var(--blue)}
.ss-group{border:1px solid var(--blue);border-radius:12px;padding:8px;margin-bottom:14px;background:rgba(74,158,218,.04)}
.ss-group .ex-card{margin-bottom:8px}
.ss-group .ex-card:last-child{margin-bottom:0}
.ss-head{display:flex;align-items:center;gap:8px;padding:2px 4px 8px}
.ss-badge{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--blue);background:#001a2e;padding:3px 8px;border-radius:6px}
.ss-note{font-size:11px;color:var(--text2)}
.ss-pick-row{display:flex;align-items:center;gap:8px;margin:8px 0 2px;flex-wrap:wrap}
.ss-pick-lbl{font-size:11px;color:var(--blue)}
.ss-select{background:var(--bg3);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-family:inherit;font-size:12px;padding:5px 8px;cursor:pointer;max-width:100%}
.set-row{display:grid;grid-template-columns:24px 1fr 1fr 36px;gap:8px;align-items:center;margin-top:8px}
.snum{font-size:11px;color:var(--text3);text-align:center}
.scheck{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border2);background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0}
.scheck.done{background:var(--green);border-color:var(--green)}
.snote-row{display:grid;grid-template-columns:24px 1fr;gap:8px;margin-top:5px}
.snote{font-size:12px;padding:6px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;width:100%}
.snote:focus{outline:none;border-color:var(--border2)}
.snote::placeholder{color:var(--text3)}
.pbval{font-size:11px;color:var(--green);margin-top:2px}
.ntext{font-size:11px;color:var(--text3);margin-top:2px}
.last-box{margin:8px 0 4px;padding:8px 10px;background:var(--bg3);border-radius:8px;border-left:2px solid var(--border2)}
.last-lbl{font-size:10px;letter-spacing:.5px;color:var(--text3);margin-bottom:5px;text-transform:uppercase}
.last-sets{display:flex;flex-wrap:wrap;gap:5px}
.lchip{font-size:12px;padding:3px 8px;background:var(--bg2);border-radius:6px;color:var(--text2)}
.pbar-wrap{height:3px;background:var(--border);border-radius:2px;margin:10px 0 0}
.pbar-fill{height:3px;border-radius:2px;background:var(--green);transition:width .3s}
.btn{border:none;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:600;transition:opacity .15s}
.btn:active{opacity:.75}
.btn-p{background:var(--text);color:var(--bg);padding:14px;font-size:15px;width:100%;display:block;margin-top:8px}
.btn-icon{background:var(--bg3);border:1px solid var(--border);color:var(--text2);width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
input[type=number],input[type=text]{background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:15px;width:100%;text-align:center;-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}
input:focus{outline:none;border-color:var(--border2)}
.hcard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.hex{font-size:12px;color:var(--text2);margin-top:6px}
.schip{display:inline-block;font-size:11px;padding:2px 7px;background:var(--bg3);border-radius:4px;margin:2px 2px 0 0;color:var(--text2)}
.srow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.sbox{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 12px;text-align:center}
.sval{font-size:24px;font-weight:700}
.slbl2{font-size:11px;color:var(--text2);margin-top:3px}
.fbar-bg{height:4px;background:var(--border);border-radius:2px;margin-top:6px}
.fbar{height:4px;border-radius:2px;transition:width .4s}
.pbrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.food-search-wrap{position:relative;margin-bottom:10px}
.food-search-input{width:100%;padding:12px 44px 12px 14px;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-family:inherit;font-size:14px;text-align:left}
.food-search-input:focus{outline:none;border-color:var(--blue)}
.food-search-input::placeholder{color:var(--text3)}
.search-spinner{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;display:none}
.search-spinner.show{display:block}
@keyframes spin{to{transform:translateY(-50%) rotate(360deg)}}
.food-result{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-top:10px}
.food-log-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.fdel{background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;padding:0 4px;line-height:1}
.saved-chip{display:inline-flex;align-items:center;padding:5px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;font-size:12px;color:var(--text2);cursor:pointer;margin:3px}
.saved-chip:active{opacity:.7}
.mbar-bg{height:5px;background:var(--border);border-radius:3px;margin-top:4px}
.mbar-fill{height:5px;border-radius:3px}
.stitle{font-size:13px;font-weight:600;margin:12px 0 8px}
.info-box{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-top:12px}
.info-box.blue{border-left:3px solid var(--blue)}
.info-box.green{border-left:3px solid var(--green)}
/* ── SWAP DRAWER ── */
.swap-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;max-width:480px;left:50%;transform:translateX(-50%)}
.swap-overlay.open{opacity:1;pointer-events:all}
.swap-drawer{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:480px;background:var(--bg2);border-radius:18px 18px 0 0;border-top:1px solid var(--border2);z-index:201;transition:transform .3s ease;padding-bottom:var(--safe-bottom)}
.swap-drawer.open{transform:translateX(-50%) translateY(0)}
.drawer-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 0}
.drawer-head{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.drawer-title{font-size:15px;font-weight:600}
.drawer-sub{font-size:11px;color:var(--text3);margin-top:3px}
.swap-option{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.swap-option:active{background:var(--bg3)}
.swap-opt-body{flex:1;min-width:0}
.swap-opt-name{font-size:14px;font-weight:500}
.swap-opt-note{font-size:11px;color:var(--text2);margin-top:2px}
.stag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;margin-top:4px}
.stag-same{background:#0a2e0a;color:var(--green)}
.stag-angle{background:#001a2e;color:var(--blue)}
.stag-harder{background:#2a1a00;color:var(--gold)}
.stag-easier{background:#1a1a1a;color:var(--text2)}
.swap-cancel{width:100%;padding:14px;background:none;border:none;color:var(--text2);font-family:inherit;font-size:14px;cursor:pointer}
.swapped-tag{font-size:10px;color:var(--blue);background:#001a2e;padding:2px 8px;border-radius:20px;display:inline-block;margin-top:2px}
.swap-btn{background:var(--bg3);border:1px solid var(--border2);border-radius:7px;color:var(--blue);font-size:11px;padding:5px 10px;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0}
.swap-btn:active{opacity:.7}
/* ── READINESS CHECK-IN ── */
.ready-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.ready-q{font-size:12px;color:var(--text2);margin:10px 0 6px}
.ready-q:first-of-type{margin-top:2px}
.ready-opts{display:flex;gap:6px}
.ready-opt{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text2);padding:9px 0;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center}
.ready-opt.sel{border-color:var(--blue);color:var(--blue);background:rgba(74,158,218,0.08)}
.ready-result{display:flex;align-items:center;gap:12px}
.ready-score{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex-shrink:0;border:2px solid}
.ready-full{border-color:var(--green);color:var(--green)}
.ready-mod{border-color:var(--gold);color:var(--gold)}
.ready-rest{border-color:var(--red);color:var(--red)}
.ready-edit{background:none;border:none;color:var(--text3);font-size:11px;cursor:pointer;font-family:inherit;text-decoration:underline;padding:0;margin-top:6px}
.mod-banner{background:rgba(201,162,39,0.1);border:1px solid var(--gold);border-radius:var(--radius);padding:10px 12px;font-size:12px;color:var(--gold);margin-bottom:14px;line-height:1.5}
.mod-suggest{font-size:11px;color:var(--gold);margin-top:4px}
/* ── INSIGHTS ── */
.insight{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--blue);border-radius:var(--radius);padding:10px 12px;font-size:12px;color:var(--text2);margin-bottom:8px;line-height:1.5}
.insight.low{border-left-color:var(--red)}
.insight.strong{border-left-color:var(--green)}
/* ── OUTCOME SHEET ── */
.outcome-sheet{position:fixed;bottom:0;left:0;right:0;margin:0 auto;transform:translateY(100%);width:100%;max-width:480px;background:var(--bg2);border-radius:18px 18px 0 0;border-top:1px solid var(--border2);z-index:201;transition:transform .3s ease;padding:18px 16px calc(18px + var(--safe-bottom))}
.outcome-sheet.open{transform:translateY(0)}
.outcome-btn{display:flex;align-items:center;gap:12px;width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);padding:14px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:8px;text-align:left}
.outcome-btn span{font-size:22px}
.outcome-skip{display:block;width:100%;background:none;border:none;color:var(--text3);font-size:12px;cursor:pointer;font-family:inherit;padding:8px;text-align:center}
/* ── TIMER-END FLASH (iOS has no vibrate — visual alert instead) ── */
.flash-overlay{position:fixed;inset:0;z-index:300;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(74,158,218,0.55) 100%)}
.flash-overlay.go{animation:flashPulse 0.5s ease-in-out 3}
@keyframes flashPulse{0%,100%{opacity:0}50%{opacity:1}}
.tauto{font-size:10px;color:var(--text3);margin-left:6px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="timer-wrap hidden" id="timerWrap">
  <div class="timer-box">
    <div class="tcircle" id="tcircle">1:30</div>
    <div class="tprog-bg">
      <div class="tprog-top">
        <span class="tprog-label">Rest timer<span class="tauto" id="tauto"></span></span>
        <div class="tdurs">
          <button class="tdur sel" onclick="setDur(90)">90s</button>
          <button class="tdur" onclick="setDur(120)">2m</button>
          <button class="tdur" onclick="setDur(180)">3m</button>
          <button class="tdur" onclick="setDur(240)">4m</button>
        </div>
      </div>
      <div class="tbar-bg"><div class="tbar-fill" id="tbarFill" style="width:100%"></div></div>
    </div>
    <button class="tskip" onclick="stopTimer()">Skip</button>
  </div>
</div>
<!-- TIMER-END VISUAL FLASH -->
<div class="flash-overlay" id="flashOverlay"></div>
<!-- SESSION OUTCOME SHEET -->
<div class="swap-overlay" id="outcomeOverlay" onclick="saveSessionWithOutcome(null)"></div>
<div class="outcome-sheet" id="outcomeSheet">
  <div style="font-size:15px;font-weight:600;margin-bottom:4px">How was the session?</div>
  <div style="font-size:11px;color:var(--text3);margin-bottom:14px">One tap — builds your energy pattern history</div>
  <button class="outcome-btn" onclick="saveSessionWithOutcome('strong')"><span>&#128170;</span>Strong</button>
  <button class="outcome-btn" onclick="saveSessionWithOutcome('average')"><span>&#128528;</span>Average</button>
  <button class="outcome-btn" onclick="saveSessionWithOutcome('low')"><span>&#128564;</span>Low energy</button>
  <button class="outcome-skip" onclick="saveSessionWithOutcome(null)">Skip — save without tag</button>
</div>
<!-- SWAP DRAWER (single, reused for all exercises) -->
<div class="swap-overlay" id="swapOverlay" onclick="closeSwapDrawer()"></div>
<div class="swap-drawer" id="swapDrawer">
  <div class="drawer-handle"></div>
  <div class="drawer-head">
    <div class="drawer-title" id="drawerTitle">Swap exercise</div>
    <div class="drawer-sub" id="drawerSub"></div>
  </div>
  <div id="drawerOptions"></div>
  <button class="swap-cancel" onclick="closeSwapDrawer()">Cancel</button>
</div>
<nav class="bnav">
  <button class="nbtn active" id="nav-start" onclick="goTab('start')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5,3 19,12 5,21"/></svg>Start
  </button>
  <button class="nbtn" id="nav-history" onclick="goTab('history')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12h8M8 8h8M8 16h5"/></svg>History
  </button>
  <button class="nbtn" id="nav-progress" onclick="goTab('progress')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/></svg>Progress
  </button>
  <button class="nbtn" id="nav-nutrition" onclick="goTab('nutrition')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>Nutrition
  </button>
</nav>
<script>
// ── ROUTINES ──
const R = [
  {id:"A",type:"Chest + Back",muscles:["Chest","Back"],focus:"Flat press · vertical pull · compound rows",pairs:"A2",
   ex:[
    {n:"Machine Bench Press",s:4,r:"10-12",m:"Chest",note:"Flat — primary horizontal press"},
    {n:"Lat Pull Down",s:4,r:"10-12",m:"Back",note:"Overhead vertical pull"},
    {n:"Wide Cheat Press",s:3,r:"10-12",m:"Chest",note:"Wide grip flat — different chest emphasis"},
    {n:"T-Bar Rows",s:4,r:"9-10",m:"Back",note:"Bent-over compound row"},
    {n:"Incline Machine",s:3,r:"10-12",m:"Chest",note:"Incline — upper chest angle"},
    {n:"Low Row Machine",s:3,r:"10-12",m:"Back",note:"Seated low horizontal pull"},
  ]},
  {id:"A2",type:"Chest + Back",muscles:["Chest","Back"],focus:"Incline fly · cable pull · unilateral row",pairs:"A",
   ex:[
    {n:"Dumbbell Incline Bench Press",s:4,r:"9-11",m:"Chest",note:"Incline — vs flat on A"},
    {n:"Cable Pulldown",s:4,r:"11-12",m:"Back",note:"Cable overhead — vs machine on A"},
    {n:"Dumbbell Incline Fly",s:3,r:"10-12",m:"Chest",note:"Fly arc — different to pressing"},
    {n:"Seated Cable Rows",s:4,r:"10-12",m:"Back",note:"Cable tension — vs T-Bar on A"},
    {n:"Peck Dec",s:3,r:"10-12",m:"Chest",note:"Horizontal fly — isolation arc"},

// Score = sleep(1-5) + energy(1-5) − 2 if joint soreness. Range 0–10.
// ≥8 Full · 5–7 Modified (−15–20% loads) · ≤4 Rest
function computeReadiness(sleep,energy,sore){
  const score=sleep+energy-(sore?2:0);
  const rec=score>=8?"full":(score>=5?"modified":"rest");
  return {sleep,energy,sore,score,rec};
}
function setReadyDraft(f,v){ readyDraft[f]=v; render(); }
function submitReadiness(){
  if(!readyDraft.sleep||!readyDraft.energy||readyDraft.sore===null){ toast("Answer all 3 questions"); return; }

  try{ localStorage.setItem("ready_"+new Date().toDateString(), JSON.stringify(readiness)); }catch(e){}
  render();
}

  readyDraft={sleep:readiness.sleep,energy:readiness.energy,sore:readiness.sore};

// ── OUTCOME PATTERN DETECTION ──
// Groups tagged sessions by weekday AND routine over the last 60 days.
// Identical groups (the Monday≡A confound) are merged into one labelled insight.
function getInsights(){
  const cutoff=Date.now()-60*86400000;
  const tagged=S.logs.filter(l=>l.outcome&&new Date(l.date).getTime()>=cutoff);
  if(tagged.length<6) return [];
  const groups={};
  tagged.forEach(l=>{
    const wd=new Date(l.date).toLocaleDateString("en-AU",{weekday:"long"});
    (groups["d:"+wd]=groups["d:"+wd]||{label:wd,ses:[]}).ses.push(l);
    (groups["r:"+l.routineId]=groups["r:"+l.routineId]||{label:l.routineId+" sessions",ses:[]}).ses.push(l);
  });
  // Merge groups whose recent sessions are identical (day/routine confound)
  const bySig={};
  Object.values(groups).forEach(g=>{
    if(g.ses.length<4) return;
    const recent=g.ses.slice(0,6); // S.logs is newest-first
    const sig=recent.map(l=>l.id).join(",");
    if(bySig[sig]) bySig[sig].labels.push(g.label);
    else bySig[sig]={labels:[g.label],recent};
  });
  const out=[];
  Object.values(bySig).forEach(({labels,recent})=>{
    const label=labels.join(" / ");
    const low=recent.filter(l=>l.outcome==="low").length;
    const strong=recent.filter(l=>l.outcome==="strong").length;
    const thresh=Math.ceil(recent.length*0.6);
    if(low>=thresh) out.push({type:"low",msg:low+" of your last "+recent.length+" "+label+" sessions were low energy — consider pre-emptive load reduction or extra carbs the night before."});
    else if(strong>=thresh) out.push({type:"strong",msg:strong+" of your last "+recent.length+" "+label+" sessions were strong — good slot for progression attempts."});
  });
  return out.slice(0,3);
}
function insightsHtml(){
  const ins=getInsights();
  if(!ins.length) return "";
  return '<div class="slabel" style="margin-top:14px">Patterns</div>'
    +ins.map(i=>'<div class="insight '+i.type+'">'+i.msg+'</div>').join("");
}

function startSession(id){
  if(readiness&&readiness.rec==="rest"&&!confirm("Readiness suggests a rest day. Start anyway?")) return;
  const r=R.find(x=>x.id===id);
  S.session=id; S.data={}; S.swaps={}; S.ssPartner=defaultSSIndex(id);
  r.ex.forEach((e,i)=>{ S.data[i]=Array.from({length:e.s},()=>({kg:"",reps:"",note:"",done:false})); });
  S.view="session"; render(); window.scrollTo(0,0);
}
function upd(ei,si,f,v){ S.data[ei][si][f]=v; }
function addSet(ei){ S.data[ei].push({kg:"",reps:"",note:"",done:false}); render(); }
function remSet(ei){ if(S.data[ei].length>1){ S.data[ei].pop(); render(); } }
function tickSet(ei,si){
  const s=S.data[ei][si]; s.done=!s.done;
  render();
  if(s.done) setTimeout(()=>smartTimer(ei),50);
}

// ── SWAP LOGIC ──
// Returns the name actually being tracked for a given exercise index
function getActiveName(ei){
  return S.swaps[ei] ? S.swaps[ei].swappedName : R.find(x=>x.id===S.session).ex[ei].n;
}

// ── CALF SUPERSET (dynamic, user-chosen partner) ──
const SS_DEFAULT={C:"Hip Thrust",C2:"Thigh Abductor"};
function defaultSSIndex(id){
  const r=R.find(x=>x.id===id); if(!r) return null;
  const n=SS_DEFAULT[id]; if(!n) return null;
  const i=r.ex.findIndex(e=>e.n===n); return i>=0?i:null;
}
// Returns display order with the ssMover (calf) moved directly after the chosen partner
function ssLayout(r){
  const moverIdx=r.ex.findIndex(e=>e.ssMover);
  let order=r.ex.map((_,i)=>i), pairWith=-1;
  if(moverIdx>=0 && S.ssPartner!=null && S.ssPartner!==moverIdx && S.ssPartner<r.ex.length && !r.ex[S.ssPartner].ssMover){
    pairWith=S.ssPartner;
    order=order.filter(i=>i!==moverIdx);
    order.splice(order.indexOf(pairWith)+1,0,moverIdx);
  }
  return {order,moverIdx,pairWith};
}
function setSSPartner(v){ S.ssPartner=(v===""||v==null)?null:parseInt(v,10); render(); }
function ssPickerHtml(ei,r){
  const opts=r.ex.map((e,i)=> i===ei?'':'<option value="'+i+'"'+(S.ssPartner===i?' selected':'')+'>'+getActiveName(i)+'</option>').join('');
  return '<div class="ss-pick-row"><span class="ss-pick-lbl">⇄ Superset with</span>'
    +'<select class="ss-select" onchange="setSSPartner(this.value)">'
    +'<option value=""'+(S.ssPartner==null?' selected':'')+'>— none —</option>'+opts
    +'</select></div>';
}

function openSwapDrawer(ei){
  const r=R.find(x=>x.id===S.session);
  const ex=r.ex[ei];
  const originalName=ex.n;
  const currentName=getActiveName(ei);
  const options=SWAPS[originalName]||[];

  document.getElementById("drawerTitle").textContent="Swap: "+currentName;
  document.getElementById("drawerSub").textContent=ex.m+" · "+ex.note;

  let html="";
  if(S.swaps[ei]){
    html+='<div class="swap-option" onclick="revertSwap('+ei+')" style="border-left:3px solid var(--red)">'
      +'<div class="swap-opt-body">'
        +'<div class="swap-opt-name" style="color:var(--red)">↩ Revert to '+originalName+'</div>'
        +'<div class="swap-opt-note">Remove swap and restore original</div>'
      +'</div></div>';
  }
  if(options.length===0){
    html+='<div style="padding:20px 16px;font-size:13px;color:var(--text3)">No swap options defined for this exercise yet.</div>';
  } else {
    html+=options.map((sw,idx)=>{
      const isCurrent=sw.name===currentName;
      return '<div class="swap-option'+(isCurrent?" selected":"")+'" onclick="applySwap('+ei+','+idx+')" style="'+(isCurrent?"opacity:.5;pointer-events:none":"")+'">'
        +'<div class="swap-opt-body">'
          +'<div class="swap-opt-name">'+sw.name+(isCurrent?" ✓":"")+'</div>'
          +'<div class="swap-opt-note">'+sw.note+'</div>'
          +'<span class="stag '+STAG_CLASS[sw.type]+'">'+STAG_LABEL[sw.type]+'</span>'
        +'</div>'
        +'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2"><polyline points="9,18 15,12 9,6"/></svg>'
      +'</div>';
    }).join("");
  }
  document.getElementById("drawerOptions").innerHTML=html;

  // Store ei for applySwap
  document.getElementById("swapDrawer").dataset.ei=ei;
  document.getElementById("swapOverlay").classList.add("open");
  document.getElementById("swapDrawer").classList.add("open");
}

function closeSwapDrawer(){
  document.getElementById("swapOverlay").classList.remove("open");
  document.getElementById("swapDrawer").classList.remove("open");
}

function applySwap(ei,optionIdx){
  const r=R.find(x=>x.id===S.session);
  const originalName=r.ex[ei].n;
  const sw=SWAPS[originalName][optionIdx];
  S.swaps[ei]={originalName:originalName,swappedName:sw.name};
  closeSwapDrawer();
  toast("Swapped to: "+sw.name);
  render();
}

function revertSwap(ei){
  delete S.swaps[ei];
  closeSwapDrawer();
  toast("Reverted to original");
  render();
}

function finish(){
  // Build the session record now, hold it while the outcome sheet is open
  const r=R.find(x=>x.id===S.session);
  const exs=r.ex.map((e,i)=>{
    const activeName=getActiveName(i);
    const isSwapped=!!S.swaps[i];
    const originalName=isSwapped?S.swaps[i].originalName:null;
    return {
      name:activeName,
      muscle:e.m,
      swapped:isSwapped,
      originalName:originalName,
      sets:S.data[i].filter(s=>s.done||s.kg||s.reps).map(s=>({kg:s.kg||"0",reps:s.reps||"0",note:s.note||"",done:s.done}))
    };
  }).filter(e=>e.sets.length);
  pendingSession={id:Date.now(),routineId:S.session,routineType:r.type,date:new Date().toISOString(),exercises:exs};
  document.getElementById("outcomeOverlay").classList.add("open");
  document.getElementById("outcomeSheet").classList.add("open");
}
function saveSessionWithOutcome(tag){
  document.getElementById("outcomeOverlay").classList.remove("open");
  document.getElementById("outcomeSheet").classList.remove("open");
  if(!pendingSession) return;
  pendingSession.outcome=tag||null;
  // Stamp readiness so plateau detection can tell intentional reductions from genuine stalls
  pendingSession.readiness=readiness?{score:readiness.score,rec:readiness.rec,sleep:readiness.sleep,energy:readiness.energy,sore:readiness.sore}:null;
  pendingSession.loadReduced=!!(readiness&&readiness.rec==="modified");
  S.logs.unshift(pendingSession);
  pendingSession=null;
  saveWorkouts(); toast("Session saved!"); S.view="pick"; S.session=null; S.swaps={}; stopTimer(); render();
}

// ── TIMER ──
let tInterval=null, tTotal=90, tLeft=90;
let audioCtx=null;
function getAudio(){ if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==="suspended") audioCtx.resume(); return audioCtx; }
document.addEventListener("touchstart",()=>{try{getAudio();}catch(e){}},{once:true});
document.addEventListener("click",()=>{try{getAudio();}catch(e){}},{once:true});

function startTimer(){
  if(tInterval){clearInterval(tInterval);tInterval=null;}
  tLeft=tTotal;
  const w=document.getElementById("timerWrap"); if(w) w.classList.remove("hidden");
  updateTimerDisplay();
  tInterval=setInterval(()=>{
    tLeft--;
    updateTimerDisplay();
    if(tLeft<=0){
      clearInterval(tInterval); tInterval=null;
      beep(); flashAlert();
      const c=document.getElementById("tcircle");
      if(c){c.className="tcircle done";c.textContent="Done!";}
      setTimeout(stopTimer,2000);
    }
  },1000);
}
function stopTimer(){
  if(tInterval){clearInterval(tInterval);tInterval=null;}
  const w=document.getElementById("timerWrap"); if(w) w.classList.add("hidden");
}
function updateTimerDisplay(){
  const c=document.getElementById("tcircle"), f=document.getElementById("tbarFill");
  if(!c||!f) return;
  const m=Math.floor(tLeft/60), s=tLeft%60;
  c.textContent=m+":"+(s<10?"0"+s:s);
  c.className="tcircle"+(tLeft<=10?" urgent":"");
  f.style.width=Math.max(0,(tLeft/tTotal)*100)+"%";
  f.style.background=tLeft<=10?"#e05c45":"#4a9eda";
}
function setDur(secs){
  tTotal=secs; tLeft=secs;
  syncDurButtons(secs);
  const la=document.getElementById("tauto"); if(la) la.textContent="";
  if(tInterval){clearInterval(tInterval);tInterval=null;startTimer();}
  else updateTimerDisplay();
}
function beep(){
  try{
    const a=getAudio();
    [0,0.25,0.5].forEach(off=>{
      const o=a.createOscillator(), g=a.createGain();
      o.connect(g); g.connect(a.destination);
      o.frequency.value=880; o.type="sine";
      g.gain.setValueAtTime(0,a.currentTime+off);
      g.gain.linearRampToValueAtTime(0.4,a.currentTime+off+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+off+0.2);
      o.start(a.currentTime+off); o.stop(a.currentTime+off+0.2);
    });
  }catch(e){}
}

// ── HELPERS ──
function getNext(){
  if(!S.logs.length) return R[0];
  const idx=ORDER.indexOf(S.logs[0].routineId);
  return R.find(r=>r.id===ORDER[(idx+1)%ORDER.length]);
}

// getPB: checks the active name AND, if the exercise was swapped, also checks the
// original name (alias pool) so PB continuity is maintained across swaps.
function getPB(name){
  let b=0;
  // Build alias pool: names that are aliased to this exercise via swap data
  const pool=new Set([name]);
  // If this name is an original, include all its swap names
  if(SWAPS[name]) SWAPS[name].forEach(sw=>pool.add(sw.name));
  // If this name is a swap target, find its original(s)
  Object.keys(SWAPS).forEach(orig=>{
    SWAPS[orig].forEach(sw=>{ if(sw.name===name) pool.add(orig); });
  });
  S.logs.forEach(l=>l.exercises.forEach(e=>{
    if(pool.has(e.name)) e.sets.forEach(s=>{const v=parseFloat(s.kg);if(!isNaN(v)&&v>b)b=v;});
  }));
  return b;
}

// getLastSets: searches by active name first, then by original if swapped
function getLastSets(rid,name){
  // Build alias pool same as getPB
  const pool=new Set([name]);
  if(SWAPS[name]) SWAPS[name].forEach(sw=>pool.add(sw.name));
  Object.keys(SWAPS).forEach(orig=>{
    SWAPS[orig].forEach(sw=>{ if(sw.name===name) pool.add(orig); });
  });
  const l=S.logs.find(l=>l.routineId===rid&&l.exercises.some(e=>pool.has(e.name)));
  if(!l) return null;
  const e=l.exercises.find(e=>pool.has(e.name));
  return e&&e.sets.length?{date:l.date,sets:e.sets,loggedName:e.name}:null;
}

function streak(){
  if(!S.logs.length) return 0;
  let n=0, p=new Date(); p.setHours(0,0,0,0);
  for(const l of S.logs){ const d=new Date(l.date); d.setHours(0,0,0,0); if(Math.round((p-d)/86400000)<=1){n++;p=d;}else break; }
  return n;
}

function mbar(val,max,color){ return '<div class="mbar-bg"><div class="mbar-fill" style="width:'+Math.min(100,Math.round(val/max*100))+'%;height:5px;border-radius:3px;background:'+color+'"></div></div>'; }

async function searchFood(){
  const q=document.getElementById("fq").value.trim();
  const g=document.getElementById("fg").value.trim();
  if(!q){ toast("Enter a food to search"); return; }
  const spin=document.getElementById("fspin");
  const res=document.getElementById("fres");
  if(spin) spin.classList.add("show");
  if(res) res.innerHTML="";
  try{
    const portionStr=g?" (portion: "+g+"g)":"";
    const prompt="You are a nutrition database. For the food item \""+q+portionStr+"\", return ONLY a valid JSON object with these exact keys: name (string), cal (integer), p (integer protein grams), c (integer carb grams), f (integer fat grams), portion (string), confidence (high/medium/low). Assume standard serving if no portion given. Return ONLY the JSON with no other text, no markdown.";
    const response=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:300,
        tools:[{type:"web_search_20250305",name:"web_search"}],
        messages:[{role:"user",content:prompt}]
      })
    });
    const data=await response.json();
    const text=data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
    const clean=text.replace(/```json|```/g,"").trim();
    const food=JSON.parse(clean);
    pendingFood=food;
    const confColor=food.confidence==="high"?"var(--green)":food.confidence==="medium"?"var(--gold)":"var(--red)";
    if(res) res.innerHTML=
      '<div class="food-result">'+
        '<div style="display:flex;justify-content:space-between;align-items:flex-start">'+
          '<div style="flex:1;font-size:14px;font-weight:600">'+food.name+'</div>'+
          '<div style="font-size:20px;font-weight:700;color:var(--green);margin-left:8px">'+food.cal+' kcal</div>'+
        '</div>'+
        '<div style="font-size:11px;color:'+confColor+';margin-top:2px">Confidence: '+food.confidence+' &middot; '+food.portion+'</div>'+
        '<div style="display:flex;gap:12px;margin-top:8px;font-size:13px;color:var(--text2)">'+
          '<span>Protein: '+food.p+'g</span>'+
          '<span>Carbs: '+food.c+'g</span>'+
          '<span>Fat: '+food.f+'g</span>'+
        '</div>'+
        '<div style="display:flex;gap:8px;margin-top:12px">'+
          '<button onclick="addPendingFood()" style="flex:1;padding:10px;background:var(--green);color:#000;border:none;border-radius:8px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer">+ Add to log</button>'+
          '<button onclick="savePendingMeal()" style="padding:10px 14px;background:var(--bg3);color:var(--text2);border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;cursor:pointer">Star Save</button>'+
        '</div>'+
      '</div>';
  }catch(e){
    if(res) res.innerHTML='<div style="color:var(--red);font-size:13px;padding:10px 0">Could not find data. Try being more specific, e.g. "200g grilled chicken breast"</div>';
  }
  if(spin) spin.classList.remove("show");
}

    const banner=document.createElement("div");
    banner.id="sunday-banner";

          +'<div style="font-size:12px;color:var(--text2);margin-top:'+(isSwapped?'3':'1')+'px">'+ex.m+'</div>'
          +'<div class="ntext">'+ex.note+'</div>'
          +(pb>0?'<div class="pbval">PB: '+pb+'kg</div>':'')
          +(ex.ssMover?ssPickerHtml(ei,r):'')
        +'</div>'
        +'<div style="display:flex;align-items:center;gap:5px;margin-left:8px;flex-wrap:wrap;justify-content:flex-end">'
          +'<button class="swap-btn" onclick="openSwapDrawer('+ei+')">⇄ Swap</button>'
          +'<button class="btn-icon" onclick="remSet('+ei+')">&#8722;</button>'
          +'<span style="font-size:12px;color:var(--text2);min-width:14px;text-align:center">'+sets.length+'</span>'
          +'<button class="btn-icon" onclick="addSet('+ei+')">+</button>'
        +'</div>'
      +'</div>'
      +lastHtml
      +'<div style="font-size:11px;color:var(--text3);margin:6px 0 2px">Target: '+ex.s+' x '+ex.r+'</div>'
      +setsHtml
    +'</div>';
  });
  // Dynamic superset: the calf (ssMover) is bracketed with the user-chosen partner
  const {order,moverIdx,pairWith}=ssLayout(r);
  let cards='';
  for(let k=0;k<order.length;k++){
    const idx=order[k];
    if(pairWith>=0 && idx===pairWith){
      cards+='<div class="ss-group"><div class="ss-head"><span class="ss-badge">SUPERSET</span><span class="ss-note">Alternate sets · one rest per round</span></div>'
        +cardHtmls[pairWith]+cardHtmls[moverIdx]+'</div>';
      k++; // skip the mover (sits directly after the partner in order)
    } else {
      cards+=cardHtmls[idx];
    }
  }
  return '<div class="back-row" onclick="if(confirm(\'Exit? Progress will be lost.\')){S.view=\'pick\';S.swaps={};stopTimer();render();}">'
    +'<span style="font-size:22px;color:var(--text2)">&#8249;</span>'
    +'<h2>'+r.type+' &mdash; '+r.id+'</h2></div>'
    +'<div class="pad">'
    +(readiness&&readiness.rec==="modified"?'<div class="mod-banner"><b>Modified session</b> &mdash; readiness '+readiness.score+'/10. Loads reduced 15&ndash;20% today; this won\'t count against progression tracking.</div>':'')
    +'<div class="card" style="margin-bottom:14px">'
      +'<div style="display:flex;justify-content:space-between;align-items:center">'
        +'<div><div style="font-size:13px;color:var(--text2)">'+don+' / '+tot+' sets complete</div>'
        +'<div style="font-size:12px;color:var(--text3);margin-top:2px">'+r.focus+'</div></div>'
        +'<div style="font-size:22px;font-weight:700;color:'+acc+'">'+pct+'%</div>'
      +'</div>'
      +'<div class="pbar-wrap"><div class="pbar-fill" style="width:'+pct+'%;background:'+acc+'"></div></div>'
    +'</div>'
    +cards
    +'<button class="btn btn-p" onclick="finish()">Save session</button>'
    +'</div>';
}

function renderBackupStatus(){
  const days=getLastBackupDays();
  const autoDate=localStorage.getItem("gl3_autobak_date");
  const autoDays=autoDate?Math.floor((new Date()-new Date(autoDate))/86400000):null;
  let color="var(--green)", msg="", sub="";
  if(days===null){
    color="var(--red)"; msg="No backup yet"; sub="Export your data now to protect your progress";
  } else if(days===0){
    color="var(--green)"; msg="Backed up today"; sub="Your data is safe";
  } else if(days<=7){
    color="var(--gold)"; msg="Last backup: "+days+" day"+(days===1?"":"s")+" ago"; sub="Next Sunday backup reminder is set";
  } else {
    color="var(--red)"; msg="Last backup: "+days+" days ago"; sub="Overdue — export your data now";
  }
  const autoMsg=autoDays!==null
    ?"Auto-save: "+(autoDays===0?"today":autoDays+" day"+(autoDays===1?"":"s")+" ago")
    :"No auto-save yet";
  return '<div style="background:var(--bg3);border-radius:8px;padding:10px 12px;margin-bottom:12px;border-left:3px solid '+color+'">'
    +'<div style="display:flex;justify-content:space-between;align-items:center">'
      +'<div>'
        +'<div style="font-size:13px;font-weight:600;color:'+color+'">'+msg+'</div>'
        +'<div style="font-size:11px;color:var(--text3);margin-top:2px">'+sub+'</div>'
      +'</div>'
      +'<div style="font-size:10px;color:var(--text3);text-align:right">'+autoMsg+'</div>'
    +'</div>'
  +'</div>';
}

function renderProgress(){
  if(!S.logs.length) return '<div class="phead"><h1>Progress</h1><p>Track your gains</p></div><div class="empty">No data yet.<br>Log a few sessions to see progress.</div>';
  const vol=S.logs.reduce((a,l)=>a+l.exercises.reduce((b,e)=>b+e.sets.reduce((c,s)=>c+(parseFloat(s.kg)||0)*(parseFloat(s.reps)||0),0),0),0);
  const str=streak();
  const cnt={}; R.forEach(r=>cnt[r.id]=0); S.logs.forEach(l=>{if(cnt[l.routineId]!==undefined)cnt[l.routineId]++;});
  const maxC=Math.max(...Object.values(cnt),1);
  // Collect all unique exercise names from logs
  const exNames=[...new Set(S.logs.flatMap(l=>l.exercises.map(e=>e.name)))];
  const pbs=exNames.map(n=>({n,pb:getPB(n)})).filter(x=>x.pb>0).sort((a,b)=>b.pb-a.pb);
  // Deduplicate PBs by alias pool so swapped exercises don't show twice
  const seenPools=new Set();
  const dedupedPbs=pbs.filter(x=>{
    const pool=new Set([x.n]);
    if(SWAPS[x.n]) SWAPS[x.n].forEach(sw=>pool.add(sw.name));
    Object.keys(SWAPS).forEach(orig=>{ SWAPS[orig].forEach(sw=>{ if(sw.name===x.n) pool.add(orig); }); });
    const key=[...pool].sort().join("|");
    if(seenPools.has(key)) return false;
    seenPools.add(key); return true;
  });
  return '<div class="phead"><h1>Progress</h1><p>Personal bests &amp; volume</p></div>'
    +'<div class="pad">'
    +'<div class="srow">'
      +'<div class="sbox"><div class="sval">'+S.logs.length+'</div><div class="slbl2">Sessions</div></div>'
      +'<div class="sbox"><div class="sval">'+str+'</div><div class="slbl2">Streak</div></div>'
      +'<div class="sbox"><div class="sval">'+(vol>0?Math.round(vol/1000)+'t':'--')+'</div><div class="slbl2">Total vol</div></div>'
    +'</div>'
    +'<div style="font-size:13px;font-weight:600;margin-bottom:10px">Routine frequency</div>'
    +R.map(r=>'<div style="margin-bottom:12px">'
      +'<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">'
        +'<span><span class="ptag pt'+r.id+'" style="margin-right:6px">'+r.id+'</span>'+r.type+'</span>'
        +'<span style="color:var(--text2)">'+cnt[r.id]+'x</span>'
      +'</div>'
      +'<div class="fbar-bg"><div class="fbar" style="width:'+Math.round(cnt[r.id]/maxC*100)+'%;background:'+ACC[r.id]+'"></div></div>'
    +'</div>').join("")
    +'<div style="height:1px;background:var(--border);margin:14px 0"></div>'
    +'<div style="font-size:13px;font-weight:600;margin-bottom:4px">Personal bests</div>'
    +'<div style="font-size:12px;color:var(--text2);margin-bottom:12px">Heaviest weight logged — aliases pooled across swaps</div>'
    +(dedupedPbs.length?dedupedPbs.map(x=>'<div class="pbrow"><span>'+x.n+'</span><span style="font-weight:600;color:var(--green)">'+x.pb+'kg</span></div>').join(""):'<div style="font-size:13px;color:var(--text2)">Log weights to track PBs</div>')
    +'<div style="height:1px;background:var(--border);margin:20px 0"></div>'
    +'<div style="font-size:13px;font-weight:600;margin-bottom:4px">Data backup</div>'
    +renderBackupStatus()
    +'<div style="font-size:12px;color:var(--text2);margin-bottom:12px">Export weekly and save to iCloud to keep your data safe</div>'
    +'<button onclick="exportData()" style="width:100%;padding:14px;background:var(--blue);color:#000;border:none;border-radius:10px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px">Download Backup</button>'
    +'<button onclick="importData()" style="width:100%;padding:14px;background:var(--bg2);color:var(--text2);border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer">Restore from Backup</button>'
    +'<div style="font-size:11px;color:var(--text3);margin-top:10px;line-height:1.6">Backup includes all sessions and saved meals. Restoring merges with existing data so nothing is overwritten.</div>'
    +'</div>';
}

function exportData(){
  try{
    const backup={version:1,exportDate:new Date().toISOString(),logs:S.logs,savedMeals:savedMeals};
    const json=JSON.stringify(backup,null,2);
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const date=new Date().toLocaleDateString('en-AU',{day:'2-digit',month:'2-digit',year:'numeric'}).replace(/\//g,'-');
    a.href=url; a.download='gymlog-backup-'+date+'.json';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
    localStorage.setItem('gl3_lastexport', new Date().toISOString());
    toast('Backup downloaded!');
  }catch(e){ toast('Export failed'); }
}

function importData(){
  const input=document.createElement('input');
  input.type='file'; input.accept='.json';
  input.onchange=function(e){
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=function(ev){
      try{
        const backup=JSON.parse(ev.target.result);
        if(!backup.logs||!Array.isArray(backup.logs)) throw new Error('Invalid');
        const d=new Date(backup.exportDate).toLocaleDateString('en-AU');
        if(!confirm('Restore '+backup.logs.length+' sessions from '+d+'? This will merge with your existing data.')) return;
        const existing=new Set(S.logs.map(l=>l.id));
        const newLogs=backup.logs.filter(l=>!existing.has(l.id));
        S.logs=[...S.logs,...newLogs].sort((a,b)=>new Date(b.date)-new Date(a.date));
        if(backup.savedMeals&&Array.isArray(backup.savedMeals)){
          const em=new Set(savedMeals.map(m=>m.name));
          backup.savedMeals.filter(m=>!em.has(m.name)).forEach(m=>savedMeals.push(m));
          saveSavedMeals();
        }
        saveWorkouts();
        toast('Restored '+newLogs.length+' new sessions!');
        render();
      }catch(err){ toast('Invalid backup file'); }
    };
    reader.readAsText(file);
  };
  document.body.appendChild(input); input.click(); document.body.removeChild(input);
}

// ── TESTS ──
function runTests(){
  let pass=0,fail=0;
  function assert(label,val,expected){
    if(JSON.stringify(val)===JSON.stringify(expected)){
      console.log("✅ "+label);pass++;
    } else {
      console.error("❌ "+label+" | got:",val,"| expected:",expected);fail++;
    }
  }

  // Test 1: SWAPS object has correct number of entries — still 34 unique routine
  // exercises. Seated Calf Raise added to C+C2; Super Pendulum Squat dropped from
  // C2 into the Hack Squat swap pool (net zero on key count). Standing Calf Raise
  // is a swap option under Seated Calf Raise, not a routine exercise.
  assert("SWAPS covers all 34 unique exercises", Object.keys(SWAPS).length, 34);

  // Test 2: All routine exercises have swap entries
  const missing=[];
  R.forEach(r=>r.ex.forEach(e=>{ if(!SWAPS[e.n]) missing.push(e.n); }));
  assert("All routine exercises have swap entries", missing, []);

  // Test 3: getPB with alias pool — swapped exercise shares PB
  const fakeLogs=[{
    id:1,routineId:"A",routineType:"Chest + Back",date:"2025-01-01",
    exercises:[{name:"Barbell Bench Press",muscle:"Chest",swapped:true,originalName:"Machine Bench Press",
      sets:[{kg:"80",reps:"10",note:"",done:true}]}]
  }];
  const origLogs=S.logs;
  S.logs=fakeLogs;
  // PB for the original name should find the swap's logged weight
  const pb=getPB("Machine Bench Press");
  assert("getPB alias pool: original finds swapped weight", pb, 80);
  // PB for the swapped name should also find it
  const pb2=getPB("Barbell Bench Press");
  assert("getPB alias pool: swapped name finds own weight", pb2, 80);
  S.logs=origLogs;

  // Test 4: getActiveName with no swap returns original
  S.session="A"; S.swaps={};
  assert("getActiveName no swap returns original", getActiveName(0), "Machine Bench Press");

  // Test 5: getActiveName after swap returns swapped name
  S.swaps={0:{originalName:"Machine Bench Press",swappedName:"Barbell Bench Press"}};
  assert("getActiveName with swap returns swapped", getActiveName(0), "Barbell Bench Press");
  S.swaps={};S.session=null;

  // Test 6: Swap options have valid type values
  const validTypes=["same","angle","harder","easier"];
  let badType=null;
  Object.entries(SWAPS).forEach(([orig,opts])=>{
    opts.forEach(o=>{ if(!validTypes.includes(o.type)) badType=orig+":"+o.name; });
  });
  assert("All swap options have valid type", badType, null);

  // Test 7: No swap option duplicates its original (would cause infinite loop)
  let selfRef=null;
  Object.entries(SWAPS).forEach(([orig,opts])=>{
    opts.forEach(o=>{ if(o.name===orig) selfRef=orig; });
  });
  assert("No swap option self-references original", selfRef, null);

  // Test 8: deduplication in progress — simulate two logs with original and swap
  const fakeLogs2=[
    {id:2,routineId:"A",routineType:"Chest + Back",date:"2025-02-01",
      exercises:[{name:"Machine Bench Press",muscle:"Chest",swapped:false,sets:[{kg:"70",reps:"10",note:"",done:true}]}]},
    {id:3,routineId:"A",routineType:"Chest + Back",date:"2025-02-08",
      exercises:[{name:"Barbell Bench Press",muscle:"Chest",swapped:true,originalName:"Machine Bench Press",sets:[{kg:"75",reps:"10",note:"",done:true}]}]},
  ];
  S.logs=fakeLogs2;
  const pbOriginal=getPB("Machine Bench Press");
  const pbSwapped=getPB("Barbell Bench Press");
  assert("Alias pool PB: original name sees both logs best (75)", pbOriginal, 75);
  assert("Alias pool PB: swapped name sees both logs best (75)", pbSwapped, 75);
  S.logs=origLogs;

  // Test 9: Seated Calf Raise is permanent in C+C2; Standing is not a default
  ["C","C2"].forEach(rid=>{
    const ex=R.find(x=>x.id===rid).ex;
    assert(rid+": Seated Calf Raise is a default exercise", ex.some(e=>e.n==="Seated Calf Raise"), true);
    assert(rid+": Standing Calf Raise is NOT a default exercise", ex.some(e=>e.n==="Standing Calf Raise"), false);
  });

  // Test 10: dropped exercises exist only in swap pools, not routines
  assert("Pendulum not a default routine exercise", R.some(r=>r.ex.some(e=>e.n==="Super Pendulum Squat")), false);
  assert("Pendulum is a Hack Squat swap option", (SWAPS["Hack Squat Machine"]||[]).map(s=>s.name).includes("Super Pendulum Squat"), true);
  assert("Standing Calf Raise is a Seated Calf Raise swap option", (SWAPS["Seated Calf Raise"]||[]).map(s=>s.name).includes("Standing Calf Raise"), true);

  // Test 11: alias pools keep PB continuity across the new swaps
  const fakeLogs3=[{id:9,routineId:"C2",routineType:"Legs",date:"2025-03-01",exercises:[
    {name:"Super Pendulum Squat",muscle:"Quads",swapped:true,originalName:"Hack Squat Machine",sets:[{kg:"120",reps:"8",note:"",done:true}]},
    {name:"Standing Calf Raise",muscle:"Calves",swapped:true,originalName:"Seated Calf Raise",sets:[{kg:"60",reps:"15",note:"",done:true}]}
  ]}];
  S.logs=fakeLogs3;
  assert("alias pool: Hack Squat PB sees Pendulum log (120)", getPB("Hack Squat Machine"), 120);
  assert("alias pool: Seated Calf PB sees Standing log (60)", getPB("Seated Calf Raise"), 60);
  assert("alias pool: Standing Calf pools via Seated (60)", getPB("Standing Calf Raise"), 60);
  S.logs=origLogs;

  // Test 12: calf is a dynamic superset mover; no leftover static ss tags
  ["C","C2"].forEach(rid=>{
    const ex=R.find(x=>x.id===rid).ex;
    assert(rid+": Seated Calf Raise has ssMover flag", ex.some(e=>e.n==="Seated Calf Raise"&&e.ssMover===true), true);
    assert(rid+": no leftover static ss tags", ex.some(e=>e.ss!==undefined), false);
  });

  // Test 13: routine defaults resolve (C → Hip Thrust, C2 → Thigh Abductor)
  assert("SS default C is Hip Thrust", SS_DEFAULT["C"], "Hip Thrust");
  assert("SS default C2 is Thigh Abductor", SS_DEFAULT["C2"], "Thigh Abductor");
  ["C","C2"].forEach(rid=>{
    const di=defaultSSIndex(rid);
    assert(rid+": default partner index resolves", di!==null&&di>=0, true);
    assert(rid+": default partner is "+SS_DEFAULT[rid], R.find(x=>x.id===rid).ex[di].n, SS_DEFAULT[rid]);
  });

  // Test 14: choosing Hip Thrust moves the calf directly after it and brackets them
  {
    const r=R.find(x=>x.id==="C");
    const hip=r.ex.findIndex(e=>e.n==="Hip Thrust");
    const calf=r.ex.findIndex(e=>e.n==="Seated Calf Raise");
    S.session="C"; S.ssPartner=hip;
    const L=ssLayout(r);
    assert("C: calf sits immediately after Hip Thrust", L.order[L.order.indexOf(hip)+1], calf);
    assert("C: pairWith is Hip Thrust", L.pairWith, hip);
    assert("C: all exercises present exactly once", L.order.slice().sort((a,b)=>a-b).join(","), r.ex.map((_,i)=>i).join(","));
  }

  // Test 15: re-pointing to Leg Extensions moves the calf there instead
  {
    const r=R.find(x=>x.id==="C");
    const ext=r.ex.findIndex(e=>e.n==="Leg Extensions");
    const calf=r.ex.findIndex(e=>e.n==="Seated Calf Raise");
    S.ssPartner=ext;
    const L=ssLayout(r);
    assert("C: calf follows Leg Extensions when chosen", L.order[L.order.indexOf(ext)+1], calf);
  }

  // Test 16: 'none' leaves the calf unpaired in its natural position
  {
    const r=R.find(x=>x.id==="C");
    S.ssPartner=null;
    const L=ssLayout(r);
    assert("C: no bracket when none selected", L.pairWith, -1);
    assert("C: order unchanged when unpaired", L.order.join(","), r.ex.map((_,i)=>i).join(","));
  }
  S.session=null; S.ssPartner=null;

  // Test 17: readiness scoring & thresholds
  assert("readiness 5+5 no soreness = full", computeReadiness(5,5,false).rec, "full");
  assert("readiness 4+4 = full (score 8)", computeReadiness(4,4,false).rec, "full");
  assert("readiness 4+4 sore = modified (score 6)", computeReadiness(4,4,true).rec, "modified");
  assert("readiness 3+2 = modified (score 5)", computeReadiness(3,2,false).rec, "modified");
  assert("readiness 2+2 = rest (score 4)", computeReadiness(2,2,false).rec, "rest");
  assert("readiness 1+1 sore = rest, score floors at 0", computeReadiness(1,1,true).score, 0);

  // Test 18: smart rest classification — compounds get 3m, isolation 90s
  assert("Smith Machine Squat is compound", classifyRest("Smith Machine Squat").secs, 180);
  assert("T-Bar Rows is compound", classifyRest("T-Bar Rows").secs, 180);
  assert("Hip Thrust is compound", classifyRest("Hip Thrust").secs, 180);
  assert("Romanian Deadlift (swap) is compound", classifyRest("Romanian Deadlift").secs, 180);
  assert("Bulgarian Split Squat (swap) is compound", classifyRest("Bulgarian Split Squat").secs, 180);
  assert("Leg Extensions is isolation", classifyRest("Leg Extensions").secs, 90);
  assert("Dumbbell Lateral Raise is isolation", classifyRest("Dumbbell Lateral Raise").secs, 90);
  assert("Cable Tri Ext is isolation", classifyRest("Cable Tri Ext").secs, 90);
  assert("Rear Kick Back Machine is isolation", classifyRest("Rear Kick Back Machine").secs, 90);

  // Test 19: reduced load range = −20% to −15%, 0.5kg rounding
  assert("reducedRange 100kg", reducedRange(100), {lo:80,hi:85});
  assert("reducedRange 62.5kg", reducedRange("62.5"), {lo:50,hi:53});
  assert("reducedRange invalid input", reducedRange("abc"), null);

  // Test 20: insights — Monday≡A confound merges into ONE insight, not two
  {
    const mk=(daysAgo,rid,outcome)=>({id:1000+daysAgo,routineId:rid,routineType:"x",date:new Date(Date.now()-daysAgo*86400000).toISOString(),outcome,exercises:[]});
    // Build 6 sessions all on the same weekday & routine, 4 of them low
    const offs=[0,7,14,21,28,35];
    const fake=offs.map((d,i)=>mk(d,"A",i<4?"low":"average"));
    S.logs=fake;
    const ins=getInsights();
    assert("confounded day/routine yields exactly 1 insight", ins.length, 1);
    assert("insight flags low energy", ins[0].type, "low");
    assert("insight label merges day and routine", ins[0].msg.indexOf("/")>=0, true);
  }

  // Test 21: insights need ≥6 tagged sessions and ≥4 per group
  {
    S.logs=[{id:1,routineId:"A",routineType:"x",date:new Date().toISOString(),outcome:"low",exercises:[]}];
    assert("too few tagged sessions = no insights", getInsights(), []);
  }
  S.logs=origLogs;

  console.log("── Tests complete: "+pass+" passed, "+fail+" failed ──");
  return {pass,fail};
}

loadStorage();
render();

// Run tests silently on load (results in console)
setTimeout(()=>{
  const r=runTests();
  if(r.fail>0) console.warn("Some tests failed — check console above");
},500);
</script>
